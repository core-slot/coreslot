# GoReleaser configuration. The release workflow runs it on a v* tag; CI runs it with --snapshot.
# Binaries are cgo-free and unsigned (no Apple Developer ID in v1); every archive is listed in
# checksums.txt, and the release workflow attests each one's build provenance.
version: 2

project_name: coreslot

before:
  hooks:
    - go mod verify

builds:
  - id: coreslot
    main: ./cmd/coreslot
    binary: coreslot
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # `coreslot version` prints this value (cmd/coreslot/main.go); a tag v0.1.0 gives 0.1.0.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: coreslot
    ids:
      - coreslot
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - PROTOCOL.md
      - CHANGELOG.md
      - THIRD_PARTY_LICENSES.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# CHANGELOG.md is the change record; the release notes point at it.
changelog:
  disable: true

release:
  prerelease: auto
  footer: |
    Changes: see CHANGELOG.md. Verify an archive with `shasum -a 256 -c checksums.txt --ignore-missing`
    and its provenance with `gh attestation verify <archive> --repo Nezhinskiy/coreslot`.
