name: ci

# Feature branches are checked through their pull request, not on every push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs these checks on the tagged commit before it builds.
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A merge to main is never cancelled by a later push; superseded pull request runs are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned analysis tools. Bump deliberately, in a reviewed change.
  # staticcheck is pinned to a commit, not a release: the newest release (v0.8.1, 2026-08-21)
  # cannot read Go 1.27 export data ("export data version 5 is greater than maximum supported
  # version 4") and fails on every package under the "stable" cell. This commit (2026-10-09,
  # "Use latest Go 1.27 release in CI") is the first that works. Move back to a release tag
  # once one newer than v0.8.1 exists.
  STATICCHECK_VERSION: 452d5bb86b45416c35891262f6a11dbd6a970117 # honnef.co/go/tools
  GOVULNCHECK_VERSION: v1.8.0 # golang.org/x/vuln, released 2026-09-08
  GO_LICENSES_VERSION: v2.0.1 # github.com/google/go-licenses/v2, released 2025-09-08

jobs:
  test:
    name: ${{ matrix.os }} / go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
        # "1.26" is go.mod's minimum; "stable" is the latest release (1.27 as of
        # 2026-10). setup-go resolves "1.26" to the newest 1.26 patch release.
        go: ["1.26", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install analysis tools
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: |
          go vet ./...
          go vet -tags coreslot_testhooks ./...
          go vet -tags coreslot_bench ./bench/...

      - name: staticcheck
        run: |
          staticcheck ./...
          staticcheck -tags coreslot_testhooks ./...
          staticcheck -tags coreslot_bench ./bench/...

      - name: govulncheck
        run: govulncheck ./...

      - name: go test -race
        run: go test -race ./...

      - name: Tests that need the test hooks (conformance and the rest)
        # Only the tests that exist with the coreslot_testhooks tag alone: `go test -race ./...`
        # above ran every other one, so they do not run twice. They are discovered, not listed,
        # so a new one needs no workflow change; finding none fails the step. All of
        # ./conformance/ is in that set.
        shell: bash
        run: |
          plain_pkgs="$(go list ./...)"
          found=0
          for pkg in $(go list -tags coreslot_testhooks ./...); do
            tagged="$(go test -tags coreslot_testhooks -list . "$pkg")"
            plain=""
            if grep -qx "$pkg" <<<"$plain_pkgs"; then
              plain="$(go test -list . "$pkg")"
            fi
            only="$(comm -13 <(grep -E '^(Test|Fuzz|Example)' <<<"$plain" | sort || true) \
              <(grep -E '^(Test|Fuzz|Example)' <<<"$tagged" | sort || true))"
            [ -n "$only" ] || continue
            found=$((found + $(wc -l <<<"$only")))
            echo "::group::$pkg"
            go test -tags coreslot_testhooks -race -short -run "^($(paste -sd'|' - <<<"$only"))\$" "$pkg"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no test needing the test hooks was discovered"
            exit 1
          fi

      - name: Python interop client
        working-directory: conformance/pyclient
        run: python3 -m unittest

      - name: Fuzz targets (30 s each)
        # Fuzzing runs once, on ubuntu-latest with the latest Go; the other cells only run the seed corpus via go test.
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: |
          # Every Fuzz function in every package, discovered rather than listed,
          # so a new target is run without editing this file. -fuzz accepts one
          # target per invocation. A failing `go test -list` (build error) fails the step;
          # only grep's "no match" (status 1, a package without fuzz targets) is tolerated.
          found=0
          for pkg in $(go list ./...); do
            listing="$(go test -list '^Fuzz' "$pkg")"
            targets="$(printf '%s\n' "$listing" | grep '^Fuzz' || [ $? -eq 1 ])"
            for target in $targets; do
              found=$((found + 1))
              echo "::group::fuzz $pkg $target"
              go test -run '^$' -fuzz "^${target}\$" -fuzztime 30s "$pkg"
              echo "::endgroup::"
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no fuzz targets discovered"
            exit 1
          fi

      - name: Upload fuzz failure inputs
        if: failure() && matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

      - name: Windows cross-build
        run: GOOS=windows go build ./...

      - name: Home directory comes from the passwd database, not $HOME (cgo off)
        if: runner.os == 'macOS'
        run: CGO_ENABLED=0 go test ./internal/config/ -run TestHomeIgnoresHOME

  # The release archives build, and the Linux binary from them runs: the same GoReleaser
  # configuration and version the release workflow uses, without publishing anything.
  snapshot-linux:
    name: release snapshot (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: GoReleaser version
        id: goreleaser
        run: |
          v="$(cat .github/goreleaser-version)"
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::.github/goreleaser-version: '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          args: release --snapshot --clean
      - name: The snapshot binaries carry no test hooks
        # The release build is never the coreslot_testhooks build: no binary records a -tags
        # setting in its build information or contains the hooks' variable prefix. Four
        # binaries, one per target in .goreleaser.yaml, so a lost build cannot pass unchecked.
        shell: bash
        run: |
          bins=(dist/coreslot_*/coreslot)
          if [ "${#bins[@]}" -ne 4 ] || [ ! -f "${bins[0]}" ]; then
            echo "::error::want 4 snapshot binaries, found: ${bins[*]}"
            exit 1
          fi
          for bin in "${bins[@]}"; do
            info="$(go version -m "$bin")"
            if grep -E '^[[:space:]]+build[[:space:]]+-tags=' <<<"$info"; then
              echo "::error::$bin was built with build tags"
              exit 1
            fi
            found=0
            grep -qa CORESLOT_TESTHOOK "$bin" || found=$?
            if [ "$found" -ne 1 ]; then
              echo "::error::$bin contains CORESLOT_TESTHOOK, or grep failed (status $found)"
              exit 1
            fi
            echo "$bin: no build tags, no test hooks"
          done
      - name: The linux/amd64 snapshot binary runs
        env:
          # A separate budget whose path contains a space, like the default macOS one.
          CORESLOT_STATE_DIR: ${{ runner.temp }}/coreslot state
        run: |
          [ "$(uname -m)" = x86_64 ] || { echo "::error::runner is $(uname -m), not x86_64"; exit 1; }
          bin=$(ls dist/coreslot_linux_amd64*/coreslot)
          "$bin" version
          "$bin" doctor
          "$bin" run -- true
          "$bin" doctor

  # The same for the macOS binary, the platform the snapshot cannot cover from Linux.
  snapshot-macos:
    name: release snapshot (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: GoReleaser version
        id: goreleaser
        run: |
          v="$(cat .github/goreleaser-version)"
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::.github/goreleaser-version: '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          args: release --snapshot --clean
      - name: The snapshot binaries carry no test hooks
        # The release build is never the coreslot_testhooks build: no binary records a -tags
        # setting in its build information or contains the hooks' variable prefix. Four
        # binaries, one per target in .goreleaser.yaml, so a lost build cannot pass unchecked.
        shell: bash
        run: |
          bins=(dist/coreslot_*/coreslot)
          if [ "${#bins[@]}" -ne 4 ] || [ ! -f "${bins[0]}" ]; then
            echo "::error::want 4 snapshot binaries, found: ${bins[*]}"
            exit 1
          fi
          for bin in "${bins[@]}"; do
            info="$(go version -m "$bin")"
            if grep -E '^[[:space:]]+build[[:space:]]+-tags=' <<<"$info"; then
              echo "::error::$bin was built with build tags"
              exit 1
            fi
            found=0
            grep -qa CORESLOT_TESTHOOK "$bin" || found=$?
            if [ "$found" -ne 1 ]; then
              echo "::error::$bin contains CORESLOT_TESTHOOK, or grep failed (status $found)"
              exit 1
            fi
            echo "$bin: no build tags, no test hooks"
          done
      - name: The darwin/arm64 snapshot binary runs
        env:
          # A separate budget whose path contains a space, like the default macOS one.
          CORESLOT_STATE_DIR: ${{ runner.temp }}/coreslot state
        run: |
          [ "$(uname -m)" = arm64 ] || { echo "::error::runner is $(uname -m), not arm64"; exit 1; }
          bin=$(ls dist/coreslot_darwin_arm64*/coreslot)
          "$bin" version
          "$bin" doctor
          "$bin" run -- true
          "$bin" doctor

  # THIRD_PARTY_LICENSES.md's inventory is what go-licenses reports for both release systems.
  licenses:
    name: license inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install go-licenses
        run: go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
      - name: THIRD_PARTY_LICENSES.md matches go-licenses report
        run: |
          for os in darwin linux; do
            GOOS=$os go-licenses report --ignore github.com/core-slot/coreslot ./... \
              > "$RUNNER_TEMP/licenses-$os.csv"
          done
          sort -u "$RUNNER_TEMP"/licenses-*.csv > "$RUNNER_TEMP/licenses.csv"
          awk '/^```csv$/ { f = 1; next } /^```$/ { f = 0 } f' THIRD_PARTY_LICENSES.md \
            | diff -u - "$RUNNER_TEMP/licenses.csv"
